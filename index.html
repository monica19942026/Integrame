   for(let i=0;i<w.length;i++){const R=r+dr*i,C=c+dc*i,x=get(R,C);if(D.mask&&!D.mask(R,C))return 0;
    if(x){if(x.ch!=w[i]||x[d])return 0;hit++}

   return hit};
  const add=([w,e,tx],r,c,d)=>{const dr=d=='D'?1:0,dc=1-dr;
   for(let i=0;i<w.length;i++){const R=r+dr*i,C=c+dc*i,k=R+','+C,x=g.get(k)||{ch:w[i]};x[d]=1;g.set(k,x)}

   ws.push([w,d,r,c,e,tx])};
  if(D.mask){let f=pool.find(p=>{const L=p[0].length,c=D.sc-(L>>1);if(L<6)return 0;for(let i=0;i<L;i++)if(!D.mask(D.sr,c+i))return 0;return 1})||pool[0];add(f,D.sr,D.sc-(f[0].length>>1),'A')}else add(pool[0],0,0,'A');
  for(const p of pool.slice(1)){if(ws.some(q=>q[0]==p[0]))continue;
   if(ws.length>=D.k)break;

   for(const [k,x] of g){const [R,C]=k.split(',').map(Number);
    for(let i=0;i<w.length;i++)if(w[i]==x.ch)for(const d of 'AD'){
